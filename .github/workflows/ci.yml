name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features schwitzer-app/remote -- -D warnings
      - run: cargo test --workspace
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: deny.toml and about.toml accept the same licences
        run: |
          licences() {
            ids=$(sed -n "/^$2 = \[/,/^\]/p" "$1" | grep -v '^ *#' | grep -o '"[^"]*"' | sort)
            test -n "$ids" || { echo "no licences found under $2 in $1" >&2; return 1; }
            printf '%s\n' "$ids"
          }
          diff <(licences deny.toml allow) <(licences crates/schwitzer-app/about.toml accepted)
      - uses: EmbarkStudios/cargo-deny-action@v2
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p schwitzer-app --all-targets --features self-update -- -D warnings
      - run: 'cargo test -p schwitzer-app --bin schwitzer --features self-update update::'
