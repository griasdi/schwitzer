name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'crates/schwitzer-app/assets/fonts/**'
      - 'crates/schwitzer-app/assets/icons/**'
      - 'crates/schwitzer-app/assets/logo/mark.svg'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Resolve the symlinks into a plain tree
        run: cp -rL site _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
