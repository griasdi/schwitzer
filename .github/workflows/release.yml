# Tags v* build every package and publish the GitHub release. Every commit on main whose CI
# passed builds them too, with the version <next patch>-dev.<commits on main>, and replaces the
# downloads of the rolling `dev` prerelease.
name: Release
on:
  push:
    tags: ['v*']
  # Builds every package without publishing, to check them before a tag.
  workflow_dispatch:
  # Every commit on main whose CI passed: the rolling `dev` prerelease.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'workflow_run' && 'dev' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  version:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          base=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            IFS=. read -r major minor patch <<<"$base"
            version="$major.$minor.$((patch + 1))-dev.$(git rev-list --count HEAD)"
          else
            version=$base
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux-x86_64 }
          - { os: ubuntu-22.04-arm, platform: linux-aarch64 }
          - { os: macos-14, platform: macos-aarch64 }
          - { os: windows-latest, platform: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)" = "$GITHUB_REF_NAME"
      - run: cargo build --release --locked -p schwitzer-app --features self-update
        env:
          SCHWITZER_VERSION: ${{ needs.version.outputs.version }}
      - if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - shell: bash
        run: deploy/package.sh ${{ matrix.platform }} "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: schwitzer-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  server:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x86_64 }
          - { os: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: server-linux-${{ matrix.arch }}
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)" = "$GITHUB_REF_NAME"
      - run: cargo build --release --locked -p schwitzer-server --target ${{ matrix.arch }}-unknown-linux-musl
        env:
          SCHWITZER_VERSION: ${{ needs.version.outputs.version }}
      - run: deploy/package.sh server-linux-${{ matrix.arch }} "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: schwitzer-server-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: [version, build, server]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          pattern: schwitzer-*
          merge-multiple: true
          path: dist
      - name: Notes and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          deploy/changelog.sh "${prev:+$prev..}$GITHUB_REF_NAME" > notes.md
          cat >> notes.md <<'EOF'

          ### Install

          - Linux: download the `.AppImage` for x86_64 or aarch64, make it executable (`chmod +x`) and run it. Or unpack the `.tar.gz` and run `schwitzer`.
          - macOS (Apple silicon): unpack, move `Schwitzer.app` to Applications and run `xattr -dr com.apple.quarantine /Applications/Schwitzer.app` once; the app is not notarized.
          - Windows: run `…-windows-x86_64-setup.exe`; it installs for your user, without admin rights. Or unpack the zip and run `schwitzer.exe`. SmartScreen asks once because the app is not signed.
          - Server (Linux x86_64 or aarch64): unpack `schwitzer-server-…-linux-<arch>.tar.gz`; the binary is static. Start it with `--auto-update` to install new releases in place and restart; keep it in a folder the server's user can write to.

          Keep the app (the AppImage too) in a folder you can write to: it installs new releases in place and restarts.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "Schwitzer ${GITHUB_REF_NAME#v}" --notes-file notes.md
  publish-dev:
    needs: [version, build, server]
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@v5
        with:
          pattern: schwitzer-*
          merge-multiple: true
          path: dist
      - name: Move the dev tag and replace the downloads
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          git tag -f dev "$SHA"
          git push -f origin refs/tags/dev
          cat >notes.md <<EOF
          Development build $VERSION of $SHA: every commit on main that passed CI lands here. It can break.

          The app installs it on the Dev update channel (Settings, Updates); a server with \`--auto-update --update-channel dev\`. Downloads have the same names as in a release.
          EOF
          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev --prerelease --title "Schwitzer dev" --notes-file notes.md
          else
            gh release create dev --prerelease --title "Schwitzer dev" --notes-file notes.md --verify-tag
          fi
          # New files first, then the old ones go: a check in between sees both and takes the newest.
          gh release upload dev dist/* --clobber
          gh release view dev --json assets --jq '.assets[].name' | while read -r name; do
            case $name in
            *"-$VERSION-"*) ;;
            *) gh release delete-asset dev "$name" --yes ;;
            esac
          done
