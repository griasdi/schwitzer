# cargo-about 0.9.2 configuration of the licenses example (examples/licenses.rs):
# https://embarkstudios.github.io/cargo-about/cli/generate/config.html
# `accepted` is a preference order: a crate under "MIT OR Apache-2.0" is listed under MIT,
# the shorter text without Apache's NOTICE duty. Same set as deny.toml's [licenses] (the CI deny job diffs the two).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "BlueOak-1.0.0",
    "MPL-2.0",
]
# The four targets the release workflow builds (.github/workflows/release.yml).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
