[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "LicenseRef-proprietary"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[workspace.dependencies]
schwitzer-proto = { path = "crates/schwitzer-proto" }
schwitzer-server = { path = "crates/schwitzer-server" }
schwitzer-client = { path = "crates/schwitzer-client" }
# Exact: weida is alpha and its wire protocol may break within 0.x.
weida = { git = "https://github.com/tuco86/weida.git", rev = "8e29fcb681fd36cd4ae668c991391a0f3d098519" }
iced = { version = "0.14", features = ["advanced", "tokio", "markdown", "svg"] }
iced_impeccable = { git = "https://github.com/tuco86/iced_impeccable.git", rev = "4c90fe0cfc87c90fa43693d1d299db35e0a1021c" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", features = ["use-std"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
hex = "0.4"
blake3 = "1.8"
rusqlite = { version = "0.37", features = ["bundled"] }
toml = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
tempfile = "3"
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = "0.7"
